# Build and test on every push and pull request: JDK 25 + Maven, the window clicked through on a virtual display
# (WindowChecklistTest), then keep the jar as a workflow artefact (the distributions, with their runtime, are built by
# the release workflow on a tag, or by scripts/package.sh and .bat).
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test, the window test on a virtual display
        run: |
          command -v xvfb-run || { sudo apt-get update -q && sudo apt-get install -y -q xvfb; }
          xvfb-run -a -s "-screen 0 1600x1000x24" mvn -B --no-transfer-progress package -Dcvescanner.windowTest=true

      - name: Keep the jar
        uses: actions/upload-artifact@v7
        with:
          name: cvescanner.jar
          path: cvescanner-app/target/cvescanner.jar
          if-no-files-found: error
