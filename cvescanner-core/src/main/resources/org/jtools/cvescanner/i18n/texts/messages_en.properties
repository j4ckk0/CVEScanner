markdown.notes=Notes and limitations
markdown.notes.text=- Maven and Gradle results cover **declared** dependencies only. For transitive dependencies run `mvn dependency:tree` / `gradle dependencies`, or enable Gradle dependency locking and re-scan.\n\
- npm results include transitive dependencies when a lockfile is present.\n\
- A match means the version is inside an advisory's affected range; whether the vulnerable code is reachable in your application still needs review.\n\
- *CVE name match ⚠* findings come from CVE List records that describe the product only by name (e.g. product `commons-text`, vendor `Apache Software Foundation`); check that they really refer to your package. The GitHub Advisory Database gives exact package matches.\n\
- *Base score* is computed from the advisory's CVSS vector (version in brackets), or the advisory's rating when there is no vector. *Environment score* applies the chosen environment (security requirements and maximum attack vector) as CVSS environmental metrics. `MAL-` advisories are known-malicious packages and are rated CRITICAL.
markdown.notes.cots=- *COTS* components (off-the-shelf: GDAL, FFmpeg…) come from component inventories (cots.csv), SBOMs, C/C++ build manifests and binaries. NVD matches them by their CPE's vendor and product (*CPE match*), or by product alone when their vendor is not known (*CPE product match ⚠*, to check); a CVE NVD says affects a component only on some platform is reported as affecting it. A version read from a binary's file name is approximate (≈).
filter.cveOnly=only vulnerabilities with a CVE ID

# the command line
cli.usage=Usage: cvescanner.sh | cvescanner.bat [options] [DIR]      (or: java -jar cvescanner.jar ...)\n\
\n\
\  DIR / -d, --dir DIR   Directory to scan (default: current directory)\n\
\  -o, --out DIR         Report output directory for --no-gui (default: ./cve-report)\n\
\      --db-dir DIR      Load every *.zip in DIR as a database (used by the launchers: database/)\n\
\      --db FILE         Load the database from a zip file (repeatable; at least one is needed).\n\
\                        Accepts the GitHub Advisory Database zip, the CVE List (cvelistV5)\n\
\                        zip, OSV.dev ecosystem zips and NVD's CVE feeds (JSON 2.0)\n\
\      --ignore FILE     Ignore file of reviewed findings (default: cvescanner-ignore.csv in DIR,\n\
\                        when there is one); its findings are left out of the counts and --fail-on\n\
\      --no-ignore       Read no ignore file: report every finding\n\
\      --db-max-age DAYS Warn when a database's newest record is older than DAYS (default 30; 0: never)\n\
\      --installed       Scan an installed product from what it ships (jars, WARs, EARs, node_modules,\n\
\                        site-packages, native libraries) rather than source projects\n\
\      --cve-only        Only report vulnerabilities that have a CVE ID\n\
\      --env PRESET      Environment for the environmental CVSS score:\n\
\                        none (default), internet, internal, airgapped, devci\n\
\      --reach R         Override reachability: internet | internal | local\n\
\      --cr / --ir / --ar V   Override the confidentiality / integrity / availability\n\
\                        requirement: L | M | H | X (not defined)\n\
\      --cvss 4|3        Preferred CVSS version when an advisory has both (default 4)\n\
\      --lang fr|en      Language of the messages and of report.md (default: the program's\n\
\                        setting, else French); findings.csv, findings.json and bom.cdx.json are in English\n\
\      --no-gui          Run headless and write report.md, findings.csv, findings.json and bom.cdx.json\n\
\                        (a CycloneDX SBOM)\n\
\      --fail-on LEVEL   With --no-gui: exit 2 if a finding is >= LOW|MEDIUM|HIGH|CRITICAL\n\
\n\
\  The window's filters (the reports, the counts and --fail-on keep only what they keep):\n\
\      --min-severity LEVEL   Only the findings at or above LOW|MEDIUM|HIGH|CRITICAL\n\
\      --ecosystem LIST       Only these ecosystems: Maven, npm, PyPI, COTS (comma-separated)\n\
\      --hide-approximate     Leave out the findings on an approximate (≈) version\n\
\      --hide-name-matches    Leave out the name matches ⚠ (CVE records, jars without coordinates)\n\
\      --search "WORDS"       Only the findings holding every word (package, CVE, file, summary…)\n\
\n\
\  The window's Apply fixes (each project's own build tool, offline; nothing installed):\n\
\      --apply-fixes          Plan the upgrades of the packages the report keeps and say them; nothing changes\n\
\      --yes                  Apply them, then scan again; exit 3 if one could not be applied\n\
\      --allow-major          Apply a major version change too (2.x to 3.x)\n\
\      --fix-packages LIST    Only these packages (comma-separated, as the report names them)\n\
\n\
\  The ignore file, edited without a scan (the one of DIR, or --ignore FILE):\n\
\      --ignore-add ID        Add an entry setting ID (a CVE or an advisory) aside; needs --reason\n\
\      --ignore-remove ID     Remove the entries naming ID (with --package / --version: only those)\n\
\      --ignore-list          List the entries\n\
\      --package P / --version V   The entry's package and version (default: any)\n\
\      --reason "TEXT"        Why the finding is set aside\n\
\      --until YYYY-MM-DD     The entry's last day (default: none)\n\
\  -h, --help            Show this help
