markdown.approximate=≈ = plus petite version permise par l'intervalle de package.json (aucun fichier de verrouillage trouvé). La version installée peut être plus récente ; ajoutez un fichier de verrouillage pour des résultats exacts.
markdown.byFile=Résultats par fichier
markdown.findings.header=| Gravité | Score de base | Score environnemental | Paquet | Version | Portée | Avis | Correspondance | CVE | Corrigé en | Résumé |
markdown.unresolved=Dépendances qui n'ont pas pu être vérifiées ({0})
markdown.unresolved.header=| Fichier | Écosystème | Paquet | Déclarée | Raison |
markdown.notes=Remarques et limites
markdown.notes.text=- Pour Maven et Gradle, seules les dépendances **déclarées** sont vérifiées. Pour les dépendances transitives, lancez `mvn dependency:tree` / `gradle dependencies`, ou activez le verrouillage des dépendances de Gradle, puis analysez de nouveau.\n\
- Pour npm, les dépendances transitives sont vérifiées quand un fichier de verrouillage est présent.\n\
- Un résultat signifie que la version est dans l'intervalle affecté d'un avis ; reste à vérifier si le code vulnérable est atteignable dans votre application.\n\
- Les résultats *Correspondance par nom CVE ⚠* viennent d'enregistrements de la CVE List qui ne décrivent le produit que par son nom (par exemple le produit `commons-text`, l'éditeur `Apache Software Foundation`) : vérifiez qu'ils désignent bien votre paquet. La GitHub Advisory Database donne des correspondances exactes par paquet.\n\
- *Score de base* est calculé à partir du vecteur CVSS de l'avis (version entre parenthèses), ou de la note de l'avis faute de vecteur. *Score environnemental* applique l'environnement choisi (exigences de sécurité et vecteur d'attaque maximal) comme métriques environnementales CVSS. Les avis `MAL-` désignent des paquets malveillants connus, notés CRITICAL.
filter.cveOnly=seulement les vulnérabilités avec un identifiant CVE

# the command line
cli.usage=Usage : cvescanner.sh | cvescanner.bat [options] [DOSSIER]      (ou : java -jar cvescanner.jar ...)\n\
\n\
\  DOSSIER / -d, --dir DOSSIER   Dossier à analyser (par défaut : le dossier courant)\n\
\  -o, --out DOSSIER     Dossier des rapports avec --no-gui (par défaut : ./cve-report)\n\
\      --db-dir DOSSIER  Charge chaque *.zip du dossier comme base (les lanceurs : database/)\n\
\      --db FICHIER      Charge la base depuis un fichier zip (répétable ; il en faut au moins un).\n\
\                        Accepte le zip de la GitHub Advisory Database, celui de la CVE List\n\
\                        (cvelistV5) et les zips d'écosystème d'OSV.dev\n\
\      --cve-only        Ne signale que les vulnérabilités qui ont un identifiant CVE\n\
\      --env PRÉRÉGLAGE  Environnement du score CVSS environnemental :\n\
\                        none (par défaut), internet, internal, airgapped, devci\n\
\      --reach R         Remplace l'accessibilité : internet | internal | local\n\
\      --cr / --ir / --ar V   Remplace l'exigence de confidentialité / d'intégrité / de\n\
\                        disponibilité : L | M | H | X (non définie)\n\
\      --cvss 4|3        Version CVSS préférée quand un avis a les deux (par défaut 4)\n\
\      --lang fr|en      Langue des messages et de report.md (par défaut : le réglage du\n\
\                        programme, sinon le français) ; findings.csv et findings.json sont en anglais\n\
\      --no-gui          Sans fenêtre : écrit report.md, findings.csv, findings.json\n\
\      --fail-on NIVEAU  Avec --no-gui : code de sortie 2 si un résultat est >= LOW|MEDIUM|HIGH|CRITICAL\n\
\  -h, --help            Affiche cette aide
