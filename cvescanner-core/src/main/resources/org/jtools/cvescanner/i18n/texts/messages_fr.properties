markdown.notes=Remarques et limites
markdown.notes.maven=- Pour Maven et Gradle, seules les dépendances **déclarées** sont vérifiées. Pour les dépendances transitives, lancez `mvn dependency:tree` / `gradle dependencies`, ou activez le verrouillage des dépendances de Gradle, puis analysez de nouveau.
markdown.notes.directOnly=- Dépendances directes seulement (`--direct-only`) : ce que les projets déclarent, à leurs versions verrouillées ; les paquets qu'elles apportent n'ont pas été analysés.
markdown.notes.mavenTransitive=- Pour Maven, les dépendances transitives sont vérifiées, d'après les poms du dépôt Maven local {0} : une dépendance dont le pom n'y est pas est vérifiée, pas ce qu'elle apporte (l'analyse dit lesquelles). Pour Gradle, seules les dépendances **déclarées** le sont : lancez `gradle dependencies`, ou activez le verrouillage des dépendances de Gradle, puis analysez de nouveau.
markdown.notes.mavenTransitiveOnly=- Pour Maven, les dépendances transitives sont vérifiées, d'après les poms du dépôt Maven local {0} : une dépendance dont le pom n'y est pas est vérifiée, pas ce qu'elle apporte (l'analyse dit lesquelles).
markdown.notes.mavenDeclared=- Pour Maven, seules les dépendances **déclarées** sont vérifiées : lancez `mvn dependency:tree`, ou laissez l'analyse lire le dépôt Maven local.
markdown.notes.gradleLocked=- Les builds Gradle avec un fichier de verrouillage (`gradle.lockfile`) donnent les versions que Gradle a résolues, transitives comprises.
markdown.notes.gradleTransitive=- Les builds Gradle sans fichier de verrouillage comprennent leurs dépendances transitives, d'après les poms du cache de Gradle {0}, la plus haute version demandée l'emportant comme dans Gradle : une dépendance dont le pom n'y est pas est vérifiée, pas ce qu'elle apporte (l'analyse dit lesquelles).
markdown.notes.gradleDeclared=- Les builds Gradle sans fichier de verrouillage ne couvrent que leurs dépendances **déclarées** : activez le verrouillage des dépendances, ou laissez l'analyse lire le cache de Gradle.
markdown.notes.text=- Pour npm, les dépendances transitives sont vérifiées quand un fichier de verrouillage est présent.\n\
- Un résultat signifie que la version est dans l'intervalle affecté d'un avis ; reste à vérifier si le code vulnérable est atteignable dans votre application.\n\
- Les résultats *Correspondance par nom CVE ⚠* viennent d'enregistrements de la CVE List qui ne décrivent le produit que par son nom (par exemple le produit `commons-text`, l'éditeur `Apache Software Foundation`) : vérifiez qu'ils désignent bien votre paquet. La GitHub Advisory Database donne des correspondances exactes par paquet.\n\
- *Score de base* est calculé à partir du vecteur CVSS de l'avis (version entre parenthèses), ou de la note de l'avis faute de vecteur. *Score environnemental* applique l'environnement choisi (exigences de sécurité et vecteur d'attaque maximal) comme métriques environnementales CVSS. Les avis `MAL-` désignent des paquets malveillants connus, notés CRITICAL.
markdown.notes.cots=- Les composants *COTS* (sur étagère : GDAL, FFmpeg…) viennent des inventaires de composants (cots.csv), des SBOM, des manifestes de build C/C++ et des binaires. La NVD les fait correspondre par l'éditeur et le produit de leur CPE (*Correspondance CPE*), ou par le seul produit quand leur éditeur n'est pas connu (*Correspondance par produit CPE ⚠*, à vérifier) ; une CVE qui, selon la NVD, n'affecte un composant que sur certaines plateformes est signalée comme l'affectant. Une version lue dans le nom d'un binaire est approchée (≈).
filter.cveOnly=seulement les vulnérabilités avec un identifiant CVE

# the command line
cli.usage=Usage : cvescanner.sh | cvescanner.bat [options] [DOSSIER]      (ou : java -jar cvescanner.jar ...)\n\
\n\
\  DOSSIER / -d, --dir DOSSIER   Dossier à analyser (par défaut : le dossier courant)\n\
\  -o, --out DOSSIER     Dossier des rapports avec --no-gui (par défaut : ./cve-report)\n\
\      --db-dir DOSSIER  Charge chaque *.zip du dossier comme base (les lanceurs : database/)\n\
\      --db FICHIER      Charge la base depuis un fichier zip (répétable ; il en faut au moins un).\n\
\                        Accepte le zip de la GitHub Advisory Database, celui de la CVE List\n\
\                        (cvelistV5), les zips d'écosystème d'OSV.dev et les flux CVE de NVD (JSON 2.0)\n\
\      --ignore FICHIER  Fichier d'exclusions des résultats examinés (par défaut : cvescanner-ignore.csv\n\
\                        dans DOSSIER, s'il y en a un) ; ses résultats sortent des décomptes et de --fail-on\n\
\      --no-ignore       Ne lit aucun fichier d'exclusions : signale chaque résultat\n\
\      --vex FICHIER     Un document VEX CycloneDX (répétable ; les *.vex.json de DOSSIER sont lus de toute\n\
\                        façon) : ses déclarations not_affected et false_positive mettent leurs résultats de côté\n\
\      --db-max-age JOURS Avertit quand l'enregistrement le plus récent d'une base a plus de JOURS (30 par défaut ; 0 : jamais)\n\
\      --maven-repo DOSSIER  Le dépôt Maven local, lu pour les dépendances transitives des poms\n\
\                        (par défaut : celui que nomme ~/.m2/settings.xml, sinon ~/.m2/repository)\n\
\      --gradle-cache DOSSIER  Le cache de Gradle (son dossier files-2.1), lu pour les dépendances transitives des\n\
\                        builds sans fichier de verrouillage (par défaut : sous GRADLE_USER_HOME, sinon ~/.gradle)\n\
\      --direct-only     Seulement les dépendances déclarées : ni le dépôt Maven local ni le cache de Gradle\n\
\                        lus, les paquets indirects des fichiers de verrouillage laissés de côté (alias : --no-transitive)\n\
\      --cache-dir DOSSIER  Garde l'index des bases entre deux analyses dans DOSSIER (les lanceurs : cache/ à côté du programme)\n\
\      --no-cache        Lit les bases depuis leurs zips à chaque analyse\n\
\      --installed       Analyse un produit installé d'après ce qu'il livre (jars, WAR, EAR, node_modules,\n\
\                        site-packages, bibliothèques natives) plutôt que des projets sources\n\
\      --cve-only        Ne signale que les vulnérabilités qui ont un identifiant CVE\n\
\      --env PRÉRÉGLAGE  Environnement du score CVSS environnemental :\n\
\                        none (par défaut), internet, internal, airgapped, devci\n\
\      --reach R         Remplace l'accessibilité : internet | internal | local\n\
\      --cr / --ir / --ar V   Remplace l'exigence de confidentialité / d'intégrité / de\n\
\                        disponibilité : L | M | H | X (non définie)\n\
\      --cvss 4|3        Version CVSS préférée quand un avis a les deux (par défaut 4)\n\
\      --lang fr|en      Langue des messages et de report.md (par défaut : le réglage du\n\
\                        programme, sinon le français) ; les fichiers CSV et JSON sont en anglais\n\
\      --no-gui          Sans fenêtre : écrit report.md, findings.csv, dependencies.csv (l'arbre des\n\
\                        dépendances, une ligne chacune avec son chemin), findings.json et bom.cdx.json (un SBOM CycloneDX)\n\
\      --fail-on NIVEAU  Avec --no-gui : code de sortie 2 si un résultat est >= LOW|MEDIUM|HIGH|CRITICAL\n\
\n\
\  Les filtres de la fenêtre (les rapports, les décomptes et --fail-on ne gardent que ce qu'ils gardent) :\n\
\      --min-severity NIVEAU  Seulement les résultats de gravité LOW|MEDIUM|HIGH|CRITICAL ou plus\n\
\      --ecosystem LISTE      Seulement ces écosystèmes : Maven, npm, PyPI, COTS (séparés par des virgules)\n\
\      --hide-approximate     Laisse de côté les résultats sur une version approchée (≈)\n\
\      --hide-transitive      Laisse de côté les dépendances indirectes (celles qu'un autre paquet apporte)\n\
\      --hide-name-matches    Laisse de côté les correspondances par nom ⚠ (enregistrements CVE, jars sans coordonnées)\n\
\      --search "MOTS"        Seulement les résultats contenant chaque mot (paquet, CVE, fichier, résumé…)\n\
\n\
\  L'application des correctifs de la fenêtre (l'outil de construction de chaque projet, hors ligne ; rien d'installé) :\n\
\      --apply-fixes          Prévoit les mises à jour des paquets que le rapport garde et les dit ; rien ne change\n\
\      --yes                  Les applique, puis analyse de nouveau ; code de sortie 3 si l'une n'a pas pu l'être\n\
\      --allow-major          Applique aussi un changement de version majeure (2.x vers 3.x)\n\
\      --fix-packages LISTE   Seulement ces paquets (séparés par des virgules, nommés comme dans le rapport)\n\
\n\
\  Le fichier d'exclusions, modifié sans analyse (celui de DOSSIER, ou --ignore FICHIER) :\n\
\      --ignore-add ID        Ajoute une entrée mettant ID (un CVE ou un avis) de côté ; demande --reason\n\
\      --ignore-remove ID     Retire les entrées nommant ID (avec --package / --version : seulement celles-là)\n\
\      --ignore-list          Liste les entrées\n\
\      --package P / --version V   Le paquet et la version de l'entrée (par défaut : n'importe lesquels)\n\
\      --reason "TEXTE"       Pourquoi le résultat est mis de côté\n\
\      --until AAAA-MM-JJ     Le dernier jour de l'entrée (par défaut : aucun)\n\
\  -h, --help            Affiche cette aide (cvescanner.sh --man : le manuel)
