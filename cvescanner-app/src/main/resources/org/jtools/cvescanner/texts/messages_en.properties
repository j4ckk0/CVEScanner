# applying fixes
fixDialog.title=Apply fixes
fixDialog.intro=Each upgrade is made by the project's own build tool, in its offline mode: a version not already in the local caches is not applied. The files are changed in place, so keep the project under version control; node_modules, updated by npm, yarn or pnpm, is not put back should a fix fail.
