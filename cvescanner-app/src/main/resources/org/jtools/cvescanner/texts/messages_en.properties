environment.reach.tip=<html>How the affected software can be reached in your environment.<br>Caps the CVSS attack vector: <i>Internal network only</i> → at most Adjacent, <i>Local access only</i> → at most Local.</html>
environment.requirement.tip=<html>CVSS security requirement: how much this property matters for the system.<br>Low / Medium / High; <i>Not defined</i> = CVSS default (neutral in 3.x, High in 4.0).</html>
environment.cvss.tip=CVSS version used when an advisory provides both a 3.x and a 4.0 vector
environment.help.title=Environmental score
environment.help=<html><body style='width:460px'>\n\
<b>Base score</b> - the CVSS score published with the advisory's vector: how severe the vulnerability is in general.<br><br>\n\
<b>Environmental score</b> - the same vector adjusted to <i>your</i> environment with CVSS environmental metrics. CVSS defines no list of environment types, so the presets below simply fill in those metrics; adjust them freely:<br><br>\n\
<b>Reachable</b> caps the attack vector (Modified Attack Vector):<br>\n\
&nbsp;• Internet / unrestricted - no change<br>\n\
&nbsp;• Internal network only - network attacks count as Adjacent<br>\n\
&nbsp;• Local access only (air-gapped) - network/adjacent attacks count as Local<br><br>\n\
<b>Confidentiality / Integrity / Availability</b> are the security requirements (CR / IR / AR): how much a breach of each would hurt this system (Low / Medium / High).<br><br>\n\
<b>Presets</b><br>\n\
&nbsp;• Internet-facing production: unrestricted, High / High / High<br>\n\
&nbsp;• Internal network service: internal, Medium / Medium / Medium<br>\n\
&nbsp;• Air-gapped / offline system: local, Medium / Medium / Medium<br>\n\
&nbsp;• Developer workstation / CI only: internal, Medium / High / Low<br><br>\n\
When an environment is applied, the <b>Severity</b> column, filters, counters and reports use the environmental severity (findings without a CVSS vector keep their advisory rating). Scores are computed for CVSS 3.0, 3.1 and 4.0; when an advisory has both versions, the selected preference decides which one is used.\n\
</body></html>

