environment.reach.tip=<html>Comment le logiciel affecté peut être atteint dans votre environnement.<br>Plafonne le vecteur d'attaque CVSS : <i>Réseau interne seulement</i> → au plus Adjacent, <i>Accès local seulement</i> → au plus Local.</html>
environment.requirement.tip=<html>Exigence de sécurité CVSS : l'importance de cette propriété pour le système.<br>Faible / Moyenne / Élevée ; <i>Non définie</i> = valeur par défaut de CVSS (neutre en 3.x, Élevée en 4.0).</html>
environment.cvss.tip=Version CVSS utilisée quand un avis donne à la fois un vecteur 3.x et un vecteur 4.0
environment.help.title=Score environnemental
environment.help=<html><body style='width:460px'>\n\
<b>Score de base</b> - le score CVSS publié avec le vecteur de l'avis : la gravité de la vulnérabilité en général.<br><br>\n\
<b>Score environnemental</b> - le même vecteur ajusté à <i>votre</i> environnement par les métriques environnementales de CVSS. CVSS ne définit pas de liste de types d'environnement : les préréglages ci-dessous remplissent simplement ces métriques ; ajustez-les librement :<br><br>\n\
<b>Accessible</b> plafonne le vecteur d'attaque (Modified Attack Vector) :<br>\n\
&nbsp;• Internet / sans restriction - aucun changement<br>\n\
&nbsp;• Réseau interne seulement - les attaques réseau comptent comme adjacentes<br>\n\
&nbsp;• Accès local seulement (isolé) - les attaques réseau ou adjacentes comptent comme locales<br><br>\n\
<b>Confidentialité / Intégrité / Disponibilité</b> sont les exigences de sécurité (CR / IR / AR) : à quel point une atteinte à chacune nuirait à ce système (Faible / Moyenne / Élevée).<br><br>\n\
<b>Préréglages</b><br>\n\
&nbsp;• Production exposée à Internet : sans restriction, Élevée / Élevée / Élevée<br>\n\
&nbsp;• Service du réseau interne : interne, Moyenne / Moyenne / Moyenne<br>\n\
&nbsp;• Système isolé / hors ligne : local, Moyenne / Moyenne / Moyenne<br>\n\
&nbsp;• Poste de développement / CI seulement : interne, Moyenne / Élevée / Faible<br><br>\n\
Quand un environnement est appliqué, la colonne <b>Gravité</b>, les filtres, les compteurs et les rapports utilisent la gravité environnementale (les résultats sans vecteur CVSS gardent la note de leur avis). Les scores sont calculés pour CVSS 3.0, 3.1 et 4.0 ; quand un avis a les deux versions, la préférence choisie décide laquelle est utilisée.\n\
</body></html>

